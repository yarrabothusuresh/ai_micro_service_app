server:
  port: ${PORT:8080}
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 90s
services:
  ui-url: ${UI_SERVICE_URL:http://localhost:8081}
  posting-url: ${POSTING_SERVICE_URL:http://localhost:8083}
  cloud-auth-enabled: ${CLOUD_AUTH_ENABLED:false}
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
