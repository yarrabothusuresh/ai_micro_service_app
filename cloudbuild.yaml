steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--build-arg', 'SERVICE=${_SERVICE}', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
substitutions:
  _SERVICE: gateway
  _IMAGE: us-east4-docker.pkg.dev/ledgermanager/ledger-demo/gateway:demo
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
