server:
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    url: ${DATABASE_MIGRATION_URL}
    user: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
services:
  rules-url: ${RULES_SERVICE_URL}
  cloud-auth-enabled: true
