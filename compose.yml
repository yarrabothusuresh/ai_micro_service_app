name: ledger-manager-demo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger_demo}
      POSTGRES_USER: ${POSTGRES_USER:-ledger_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["ledger-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  rules-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: rules-service }
    environment: { PORT: "8082" }
    ports: ["127.0.0.1:8082:8082"]
  posting-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: posting-service }
    environment:
      PORT: "8083"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledger_demo}
      DATABASE_USERNAME: ${POSTGRES_USER:-ledger_demo}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      RULES_SERVICE_URL: http://rules-service:8082
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      rules-service: { condition: service_started }
  ui-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: ui-service }
    environment:
      PORT: "8081"
      POSTING_SERVICE_URL: http://posting-service:8083
    ports: ["127.0.0.1:8081:8081"]
    depends_on: [posting-service]
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: gateway }
    environment:
      PORT: "8080"
      UI_SERVICE_URL: http://ui-service:8081
      POSTING_SERVICE_URL: http://posting-service:8083
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [ui-service, posting-service]
volumes:
  ledger-postgres:
